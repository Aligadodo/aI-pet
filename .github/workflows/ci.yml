name: Source and protocol CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/SweetGirlfriendPetAndroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run Android JVM tests and lint through the shared pipeline
        env:
          SWEETPET_RUN_ID: ci-android-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/scripts/sweetpet.py" iterate
          --profile ci --component android --run-id "$SWEETPET_RUN_ID"
      - name: Add pipeline summary
        if: always()
        env:
          SWEETPET_RUN_ID: ci-android-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          report="$GITHUB_WORKSPACE/outputs/pipeline/$SWEETPET_RUN_ID/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  petpack-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petpack/PetPack-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install QA dependencies
        run: python -m pip install Pillow==12.2.0 numpy==2.4.6
      - name: Test tools, validate every pack, and run exact-warning QA
        env:
          SWEETPET_RUN_ID: ci-petpack-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/scripts/sweetpet.py" iterate
          --profile ci --component petpack --pack jk-beach-summer
          --run-id "$SWEETPET_RUN_ID"
      - name: Add pipeline summary
        if: always()
        env:
          SWEETPET_RUN_ID: ci-petpack-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          report="$GITHUB_WORKSPACE/outputs/pipeline/$SWEETPET_RUN_ID/summary.md"
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/SweetGirlfriendDesktopPet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/SweetGirlfriendDesktopPet/requirements-build.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run desktop tests through the shared pipeline
        env:
          SWEETPET_RUN_ID: ci-desktop-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          python "$env:GITHUB_WORKSPACE/scripts/sweetpet.py" iterate
          --profile ci --component desktop --run-id "$env:SWEETPET_RUN_ID"
      - name: Add pipeline summary
        if: always()
        env:
          SWEETPET_RUN_ID: ci-desktop-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $report = Join-Path $env:GITHUB_WORKSPACE "outputs/pipeline/$env:SWEETPET_RUN_ID/summary.md"
          if (Test-Path -LiteralPath $report) { Get-Content -Raw -LiteralPath $report >> $env:GITHUB_STEP_SUMMARY }
