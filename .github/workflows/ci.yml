name: Source and protocol CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-jvm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/SweetGirlfriendPetAndroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run Android JVM tests and lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon \
            :content-pack:testDebugUnitTest \
            :overlay-host:testDebugUnitTest \
            :pet-runtime:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug

  petpack-protocol:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petpack/PetPack-v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install QA dependencies
        run: python -m pip install Pillow==12.2.0 numpy
      - name: Run PetPack tool tests
        run: |
          python -m unittest discover -s tools -p 'test_*.py' -v
          python -m unittest discover -s ../../scripts -p 'test_*.py' -v
      - name: Validate every source pack
        run: |
          python tools/petpack.py validate packs/girlfriend-classic
          python tools/petpack.py validate packs/jk-beach-summer
          python tools/petpack.py qa packs/jk-beach-summer --reports "$RUNNER_TEMP/jk-beach-qa"

  desktop-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/SweetGirlfriendDesktopPet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: desktop/SweetGirlfriendDesktopPet/requirements-build.txt
      - name: Install desktop dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run desktop tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
