name: PetPack Android install gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'petpack/PetPack-v2/**'
      - 'android/SweetGirlfriendPetAndroid/**'
      - '.github/scripts/run-petpack-android-install-gate.sh'
      - '.github/workflows/petpack-android-install-gate.yml'
  pull_request:
    paths:
      - 'petpack/PetPack-v2/**'
      - 'android/SweetGirlfriendPetAndroid/**'
      - '.github/scripts/run-petpack-android-install-gate.sh'
      - '.github/workflows/petpack-android-install-gate.yml'

permissions:
  contents: read

jobs:
  emulator-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PetPack QA dependencies
        run: python -m pip install Pillow==12.2.0 numpy
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, install, reload, and verify the JK pack
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          # API 35 is sufficient for an app targeting 36 and is substantially more
          # stable on GitHub's current Linux/KVM runners than the API 36 image.
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          disable-animations: false
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
            -no-metrics
            -camera-back none
            -camera-front none
          # Keep this as one command: android-emulator-runner executes each line
          # in a multiline script through a separate /bin/sh invocation.
          script: sh .github/scripts/run-petpack-android-install-gate.sh
