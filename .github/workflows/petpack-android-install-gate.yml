name: PetPack Android install gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'petpack/PetPack-v2/**'
      - 'android/SweetGirlfriendPetAndroid/**'
      - '.github/workflows/petpack-android-install-gate.yml'
  pull_request:
    paths:
      - 'petpack/PetPack-v2/**'
      - 'android/SweetGirlfriendPetAndroid/**'
      - '.github/workflows/petpack-android-install-gate.yml'

permissions:
  contents: read

jobs:
  emulator-install-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install PetPack QA dependencies
        run: python -m pip install Pillow==12.2.0 numpy
      - name: Build, install, reload, and verify the JK pack
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: >-
            cd petpack/PetPack-v2 &&
            python tools/petpack.py publish packs/jk-beach-summer
            --output "$RUNNER_TEMP/jk-beach-summer-1.0.0.petpack"
            --reports "$RUNNER_TEMP/jk-beach-report"
            --allow-warnings
            --android-project ../../android/SweetGirlfriendPetAndroid
            --serial emulator-5554
